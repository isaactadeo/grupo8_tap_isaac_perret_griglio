services:
  db:
    image: postgis/postgis:16-3.4
    container_name: rafaela_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rafaela
      POSTGRES_PASSWORD: rafaela
      POSTGRES_DB: rafaela
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rafaela -d rafaela"]
      interval: 5s
      timeout: 5s
      retries: 5
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    container_name: rafaela_elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  elasticsearch_data:
